detection:
  z_threshold: 3.0
  pct_jump_threshold: 50.0
  ewma_alpha: 0.3
  ewma_drift_ratio: 1.3
  min_samples: 5
  std_floor_pct: 0.05
  std_floor_abs: 0.01
  aggregate_pct_threshold: 50.0
  dedup_window_hours: 6
  new_resource_cost_floor: 1.0
severity:
  critical: {z: 10, pct: 300}
  high: {z: 6, pct: 150}
  medium: {z: 4, pct: 100}
queue:
  max_retries: 3
  retry_backoff_seconds: [1, 3, 9]
  claim_idle_ms: 15000
  batch_size: 100
cache:
  summary_ttl_seconds: 60
  baseline_ttl_seconds: 300
