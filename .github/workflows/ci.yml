name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccad
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ccad
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ccad"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://ccad:test_password@localhost:5432/ccad
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 app/ tests/ --max-line-length=120 --ignore=E501,W503

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --junitxml=results/junit.xml

      - name: Run migrations
        run: alembic upgrade head

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/junit.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t ccad-api:ci-test .

      - name: Verify image
        run: docker run --rm ccad-api:ci-test python -c "from app.main import app; print('OK')"
