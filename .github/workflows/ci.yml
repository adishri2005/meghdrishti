name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meghdrishti
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: meghdrishti
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U meghdrishti"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://meghdrishti:test_password@localhost:5432/meghdrishti
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app/ tests/

      - name: Run unit & integration tests with coverage
        run: |
          mkdir -p results
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml:results/coverage.xml --cov-report=term --junitxml=results/junit.xml

      - name: Run migrations
        run: alembic upgrade head

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/junit.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t meghdrishti-api:ci-test .

      - name: Verify image
        run: docker run --rm --entrypoint python meghdrishti-api:ci-test -c "from app.main import app; print('OK')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Run unit & component tests
        run: cd frontend && npm test

      - name: Build production bundle
        run: cd frontend && npm run build

