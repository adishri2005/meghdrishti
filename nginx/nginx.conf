worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id" ${request_time}s';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript text/xml application/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Active upstream (switched by deploy scripts)
    upstream api_active {
        include /etc/nginx/active/upstream.inc;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # HTTPS server (Single-origin CostGuard Gateway)
    server {
        listen 443 ssl;
        server_name _;

        error_page 497 https://$host:8443$request_uri;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Standard OWASP security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Internal authentication verification endpoint for subrequests
        location = /_auth_verify {
            internal;
            proxy_pass http://api_active/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        # Error handling for unauthorized subrequests
        location @error401 {
            default_type application/json;
            return 401 '{"error": {"code": 401, "message": "Unauthorized: Session or Bearer token required"}}';
        }

        location @error403 {
            default_type application/json;
            return 403 '{"error": {"code": 403, "message": "Forbidden: Insufficient privileges"}}';
        }

        # Protected Grafana reverse proxy (supports web-sockets for live panels)
        location /grafana/ {
            auth_request /_auth_verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Protected Prometheus reverse proxy (strips prefix with trailing slash)
        location /prometheus/ {
            auth_request /_auth_verify;
            error_page 401 = @error401;
            error_page 403 = @error403;

            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time SSE Log Stream (disable proxy buffering and set long timeout)
        location /api/v1/admin/logs/stream {
            proxy_pass http://api_active;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # API endpoints
        location /api/ {
            proxy_pass http://api_active;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Health endpoint
        location = /health {
            proxy_pass http://api_active;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API documentation
        location ~ ^/(docs|openapi\.json|redoc) {
            proxy_pass http://api_active;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus /metrics endpoint is internal only
        location = /metrics {
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://api_active;
        }

        # Nginx stub_status (internal only)
        location /nginx_status {
            stub_status;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }

        # CostGuard SPA Frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
