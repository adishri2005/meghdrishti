services:
  # --- Core Infrastructure ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_pg}
      POSTGRES_DB: ${POSTGRES_DB:-ccad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccad}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ccad-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ccad-net

  # --- Application (Blue/Green) ---
  api-blue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${BLUE_TAG:-1.0.0}
    image: ccad-api:${BLUE_TAG:-1.0.0}
    command: ["api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://ccad:change_me_pg@postgres:5432/ccad}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-analyst}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-Analyst@12345}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-svc-ingest-key-change-me}
      APP_VERSION: ${BLUE_TAG:-1.0.0}
      APP_COLOR: blue
      FAULTY_RELEASE: ${FAULTY_RELEASE_BLUE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /var/log/app/app.log
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - applogs-blue:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - ccad-net

  api-green:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${GREEN_TAG:-1.0.0}
    image: ccad-api:${GREEN_TAG:-1.0.0}
    command: ["api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://ccad:change_me_pg@postgres:5432/ccad}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-analyst}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-Analyst@12345}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-svc-ingest-key-change-me}
      APP_VERSION: ${GREEN_TAG:-1.0.0}
      APP_COLOR: green
      FAULTY_RELEASE: ${FAULTY_RELEASE_GREEN:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /var/log/app/app.log
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - applogs-green:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - ccad-net
    profiles:
      - green

  # --- Worker ---
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${BLUE_TAG:-1.0.0}
    image: ccad-api:${BLUE_TAG:-1.0.0}
    command: ["worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://ccad:change_me_pg@postgres:5432/ccad}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_VERSION: ${BLUE_TAG:-1.0.0}
      APP_COLOR: blue
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /var/log/app/worker.log
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - applogs-worker:/var/log/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ccad-net

  # --- Reverse Proxy ---
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active:/etc/nginx/active
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-blue
    restart: unless-stopped
    networks:
      - ccad-net

  # --- Monitoring ---
  prometheus:
    image: prom/prometheus:v2.54.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - ccad-net

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - ccad-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - ccad-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-ccad}:${POSTGRES_PASSWORD:-change_me_pg}@postgres:5432/${POSTGRES_DB:-ccad}?sslmode=disable"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - ccad-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    networks:
      - ccad-net

volumes:
  pgdata:
  redisdata:
  applogs-blue:
  applogs-green:
  applogs-worker:
  prometheus-data:
  grafana-data:

networks:
  ccad-net:
    driver: bridge
